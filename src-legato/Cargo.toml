[package]
name = "downstream-tui"
version = "0.1.0"
description = "A small Legato TUI application"
authors = ["Luke <lukeweston1234@gmail.com>"]
license = "AGPL-3.0"
edition = "2024"

[dependencies]
color-eyre = "0.6.3"
crossterm = "0.29.0"
legato = "0.0.19"
ratatui = { version = "0.30.0", features = ["unstable-widget-ref"] }
realfft = "3.5.0"
rtrb = "0.3.3"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
